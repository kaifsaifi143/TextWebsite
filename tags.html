<!DOCTYPE html>
<html>
<head>
    <title>HTML Formatting Tags Example</title>
</head>
<body>

    <h1>Main Heading (H1)</h1>
    <h2>Sub Heading (H2)</h2>

    <p>
        This is a paragraph. HTML is used to create web pages.
    </p>

    <p>
        <b>Bold Text</b><br>
        <strong>Strong Important Text</strong><br>
        <i>Italic Text</i><br>
        <em>Emphasized Text</em><br>
        <u>Underlined Text</u>
    </p>

</body>
</html>
